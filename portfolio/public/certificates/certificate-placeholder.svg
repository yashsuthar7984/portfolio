<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>
  
  <!-- Outer Borders -->
  <rect x="30" y="30" width="940" height="640" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" rx="6"/>
  <rect x="42" y="42" width="916" height="616" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" rx="4" opacity="0.45"/>

  <!-- Corner Brackets -->
  <path d="M 52 75 L 52 52 L 75 52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M 948 75 L 948 52 L 925 52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M 52 625 L 52 648 L 75 648" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M 948 625 L 948 648 L 925 648" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Top Title -->
  <text x="500" y="150" font-family="'Oswald', sans-serif" font-weight="700" font-size="32" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">CERTIFICATE OF COMPLETION</text>
  <text x="500" y="185" font-family="'Inter', sans-serif" font-size="14" fill="#8c8c8c" text-anchor="middle" letter-spacing="2">SPECIALIZED COURSEWORK</text>

  <line x1="340" y1="210" x2="660" y2="210" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

  <!-- Recipient -->
  <text x="500" y="270" font-family="'Inter', sans-serif" font-size="15" fill="#8c8c8c" text-anchor="middle">This certifies that</text>
  <text x="500" y="335" font-family="'Oswald', sans-serif" font-weight="700" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="2">YASH SUTHAR</text>
  <text x="500" y="380" font-family="'Inter', sans-serif" font-size="15" fill="#8c8c8c" text-anchor="middle">has successfully completed the curriculum for</text>

  <!-- Credential Box -->
  <rect x="240" y="405" width="520" height="56" rx="6" fill="rgba(179, 0, 0, 0.15)" stroke="url(#redGrad)" stroke-width="1.5"/>
  <text x="500" y="442" font-family="'Oswald', sans-serif" font-weight="600" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">GENAI WITH PYTHON</text>

  <!-- Description -->
  <text x="500" y="505" font-family="'Inter', sans-serif" font-size="13" fill="#61afef" text-anchor="middle" letter-spacing="1">
    Generative AI Foundations &bull; Python Programming &bull; Prompt Workflows
  </text>

  <!-- Seal -->
  <g transform="translate(500, 580)">
    <circle cx="0" cy="0" r="36" fill="#141414" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="-4" font-family="'Oswald', sans-serif" font-size="11" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">COURSE</text>
    <text x="0" y="12" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">VERIFIED</text>
  </g>
</svg>
